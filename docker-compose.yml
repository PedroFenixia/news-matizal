services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://news.matizal.com}
    image: matizal-news:latest
    container_name: matizal-news
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/var/lib/matizal-news/db.sqlite
    ports:
      # Solo loopback: nginx del host es el único punto público (443/80).
      - "127.0.0.1:3021:3000"
    volumes:
      # Persiste la SQLite fuera del contenedor efímero.
      - /var/lib/matizal-news:/var/lib/matizal-news
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
