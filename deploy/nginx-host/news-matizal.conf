# Vhost de referencia para nginx del HOST (fuera de Docker), siguiendo el
# mismo patrón que el resto de apps de este VPS (erp, advisor, hr-fenixia,
# prospector). Instalar manualmente en /etc/nginx/conf.d/news-matizal.conf
# (o /etc/nginx/sites-available + symlink, según la convención del sistema).
#
# IMPORTANTE: no solicitar el certificado con certbot hasta que el DNS de
# news.matizal.com ya resuelva a la IP de esta VPS (registro A, ver README).

server {
    listen 91.134.43.229:443 ssl;
    http2 on;
    server_name news.matizal.com;

    ssl_certificate     /etc/letsencrypt/live/news.matizal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.matizal.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}

server {
    listen 91.134.43.229:80;
    server_name news.matizal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/news-matizal;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
